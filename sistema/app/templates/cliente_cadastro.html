<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — InovaTech Supply</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="header">
    <a href="{{ url_for('home') }}" class="logo"><span class="logo-icon">◈</span>INOVATECH</a>
    <nav class="nav" aria-label="Navegação principal">
      <a href="{{ url_for('home') }}">Produtos</a>
      <a href="{{ url_for('cadastro_clientes') }}" class="active">Clientes</a>
      <a href="{{ url_for('home') }}#carrinho">Carrinho</a>
    </nav>
  </header>

  <main class="container clientes-page">
    <div class="titulo-pagina">
      <div>
        <p class="eyebrow">Gestão de relacionamento</p>
        <h1>Área de Clientes</h1>
      </div>
      <span class="contagem" id="contagem-clientes">0 clientes</span>
    </div>

    <div class="clientes-layout">
      <section class="painel-cliente" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Novo cliente</h2>
        <form id="form-cliente">
          <input type="hidden" id="cliente-id">
          <label for="nome">Nome completo <span>*</span></label>
          <input id="nome" name="nome" required maxlength="150" autocomplete="name">
          <label for="nome_empresa">Empresa</label>
          <input id="nome_empresa" name="nome_empresa" maxlength="150" autocomplete="organization">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" maxlength="150" autocomplete="email">
          <div class="campos-duplos">
            <div><label for="pais">País</label><input id="pais" name="pais" maxlength="100" value="Brasil" autocomplete="country-name"></div>
            <div><label for="telefone">Telefone</label><input id="telefone" name="telefone" maxlength="50" autocomplete="tel"></div>
          </div>
          <div class="acoes-formulario">
            <button class="btn-principal" type="submit" id="btn-salvar">Cadastrar cliente</button>
            <button class="btn-secundario" type="button" id="btn-cancelar" hidden>Cancelar</button>
          </div>
          <p class="mensagem-formulario" id="mensagem-formulario" role="status"></p>
        </form>
      </section>

      <section class="clientes-lista-painel" aria-labelledby="titulo-lista">
        <div class="painel-cabecalho">
          <h2 id="titulo-lista">Clientes cadastrados</h2>
          <input id="busca-cliente" type="search" placeholder="Buscar cliente..." aria-label="Buscar cliente">
        </div>
        <div id="lista-clientes" class="lista-clientes" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <footer class="footer">InovaTech Supply — sistema interno de gestão</footer>
  <script src="{{ url_for('static', filename='js/cliente.js') }}"></script>
</body>
</html>
